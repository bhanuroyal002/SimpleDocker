services:
  app:
    image: movie-ticket-booking:${IMAGE_TAG}
    container_name: movie-ticket-booking
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: moviebooking
      DB_USER: movieuser
      DB_PASSWORD: moviepass
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: movie-ticket-db:${IMAGE_TAG}
    container_name: movie-ticket-db
    environment:
      MYSQL_DATABASE: moviebooking
      MYSQL_USER: movieuser
      MYSQL_PASSWORD: moviepass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
